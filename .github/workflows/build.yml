name: Build SukiSU Ultra v3.2.0 buat A57 - LOS 19.1 - RIVENMAX
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev
      - name: Build via a57-build.sh
        run: |
          chmod +x a57-build.sh
          ./a57-build.sh
      - name: Upload LOG
        uses: actions/upload-artifact@v4
        with:
          name: build-log-SUKISU-RIVENMAX-19.1
          path: build.log
      - name: Upload Boot
        uses: actions/upload-artifact@v4
        with:
          name: A57-SUKISU-ULTRA-LOS19.1-RIVENMAX
          path: |
            Image.gz
            Image.gz-dtb
            Image
            arch/arm64/boot/Image.gz-dtb
